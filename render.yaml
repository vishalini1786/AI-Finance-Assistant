services:
  # 1. FinMan Node.js Backend API
  - type: web
    name: ai-finance-assistant-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai-finance-assistant-ocr
          property: host

  # 2. FinMan Python FastAPI OCR & ML Microservice
  - type: web
    name: ai-finance-assistant-ocr
    env: docker
    dockerfilePath: backend/ml-service/Dockerfile
    dockerContext: backend/ml-service
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
