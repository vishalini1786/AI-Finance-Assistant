name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package.json
            backend/package.json

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Verify Backend Integrity
        working-directory: backend
        run: |
          npm install
          node -c src/server.js
          node -c src/app.js
